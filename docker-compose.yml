services:
  jellyplex-watched:
    image: ${IMAGE}
    container_name: jellyplex-watched
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    env_file: "./.env"
    
    volumes:
      - jellyplex-watched-config:/config  # Persist configuration and database
    
    networks:
      - media
    
    # Optional: depends_on if running Jellyfin/Plex in compose
    # depends_on:
    #   - jellyfin
    #   - plex

volumes:
  jellyplex-watched-config:

networks:
  media:
    driver: bridge
